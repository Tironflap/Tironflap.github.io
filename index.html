<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, initial-scale=1.0">
    <title>3DS Reddit Reader</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #0f0; margin: 0; padding: 10px; }
        input, button { background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px; margin: 5px 0; width: 100%; font-size: 16px; }
        button { background: #004400; font-weight: bold; }
        .post { border-bottom: 1px solid #003300; padding: 10px 0; overflow: hidden; clear: both; }
        .title { color: #0ff; font-weight: bold; font-size: 14px; text-decoration: none; display: block; }
        .thumb { float: left; margin: 0 10px 5px 0; width: 80px; height: 80px; object-fit: cover; border: 1px solid #333; }
        .meta { color: #888; font-size: 11px; }
        .status { color: #ff0; text-align: center; font-size: 13px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🕹️ 3DS Reddit</h1>
    <input type="text" id="subreddit" value="all">
    <button onclick="loadPosts(false)">Refresh Subreddit</button>
    
    <div id="status" class="status">Ready</div>
    <div id="posts"></div>
    <button id="nextBtn" style="display:none;" onclick="loadPosts(true)">Next Page ➡️</button>

    <script type="text/javascript">
        var WORKER_URL = "https://damp-shape-c392.k-oleg-dd.workers.dev/?url=";
        var after = "";

        function loadPosts(isNext) {
            var sub = document.getElementById('subreddit').value || 'all';
            var status = document.getElementById('status');
            var postsDiv = document.getElementById('posts');
            
            status.innerHTML = "Loading...";
            if (!isNext) { postsDiv.innerHTML = ""; after = ""; }

            var redditUrl = "https://www.reddit.com/r/" + sub + ".json?limit=5&after=" + after;
            var finalUrl = WORKER_URL + encodeURIComponent(redditUrl);

            var xhr = new XMLHttpRequest();
            xhr.open("GET", finalUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var json = JSON.parse(xhr.responseText);
                    after = json.data.after;
                    render(json);
                    status.innerHTML = "r/" + sub;
                    document.getElementById('nextBtn').style.display = "block";
                }
            };
            xhr.send();
        }

        function render(json) {
            var postsDiv = document.getElementById('posts');
            var children = json.data.children;

            for (var i = 0; i < children.length; i++) {
                var p = children[i].data;
                var div = document.createElement('div');
                div.className = 'post';

                // We pass the image through the worker to keep the 3DS from choking on SSL/Size
                var imgTag = "";
                if (p.thumbnail && p.thumbnail.indexOf("http") === 0) {
                    var proxiedImg = WORKER_URL + encodeURIComponent(p.thumbnail) + "&type=img";
                    imgTag = '<img src="' + proxiedImg + '" class="thumb">';
                }

                div.innerHTML = imgTag + 
                    '<a class="title" href="https://old.reddit.com' + p.permalink + '">' + p.title + '</a>' +
                    '<div class="meta">r/' + p.subreddit + ' | ' + p.score + ' pts</div>';
                
                postsDiv.appendChild(div);
            }
        }

        window.onload = function() { loadPosts(false); };
    </script>
</body>
</html>
