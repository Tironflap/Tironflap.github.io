<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, initial-scale=1.0">
    <title>3DS Reddit Reader</title>
    <style>
        body {
            font-family: sans-serif;
            background: #000;
            color: #0f0;
            margin: 0;
            padding: 10px;
        }
        h1 {
            color: #0f0;
            text-align: center;
            font-size: 18px;
            margin: 5px 0;
        }
        input, button {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background: #004400;
            font-weight: bold;
        }
        .post {
            border-bottom: 1px solid #003300;
            padding: 12px 0;
        }
        .title {
            color: #0ff;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            display: block;
        }
        .meta {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }
        .status {
            color: #ff0;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🕹️ 3DS Reddit</h1>
    
    <input type="text" id="subreddit" value="all" placeholder="subreddit name">
    <button onclick="loadPosts()">View Subreddit</button>
    
    <div id="status" class="status">System Ready</div>
    <div id="posts"></div>

    <script type="text/javascript">
        // Your specific Cloudflare Worker URL
        var WORKER_URL = "http://damp-shape-c392.k-oleg-dd.workers.dev/?url=";

        function loadPosts() {
            var sub = document.getElementById('subreddit').value || 'all';
            var status = document.getElementById('status');
            var postsDiv = document.getElementById('posts');
            
            status.innerHTML = "Connecting to Worker...";
            postsDiv.innerHTML = "";

            // We limit to 5 posts to prevent the 3DS from running out of RAM
            var redditUrl = "https://www.reddit.com/r/" + sub + ".json?limit=5&raw_json=1";
            var finalUrl = WORKER_URL + encodeURIComponent(redditUrl);

            var xhr = new XMLHttpRequest();
            xhr.open("GET", finalUrl, true);

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var json = JSON.parse(xhr.responseText);
                            render(json);
                            status.innerHTML = "Showing r/" + sub;
                        } catch (e) {
                            status.innerHTML = "Error parsing data.";
                        }
                    } else {
                        status.innerHTML = "Worker Error: " + xhr.status;
                    }
                }
            };

            xhr.onerror = function() {
                status.innerHTML = "Connection Failed.";
            };

            xhr.send();
        }

        function render(json) {
            var postsDiv = document.getElementById('posts');
            var children = json.data.children;
            
            if (children.length === 0) {
                postsDiv.innerHTML = "No posts found.";
                return;
            }

            for (var i = 0; i < children.length; i++) {
                var p = children[i].data;
                var div = document.createElement('div');
                div.className = 'post';

                // Use old.reddit.com links because the 3DS handles them much better
                var link = "https://old.reddit.com" + p.permalink;
                
                div.innerHTML = 
                    '<a class="title" href="' + link + '">' + p.title + '</a>' +
                    '<div class="meta">r/' + p.subreddit + ' | ' + p.score + ' points</div>';
                
                postsDiv.appendChild(div);
            }
        }

        // Initial load
        window.onload = loadPosts;
    </script>
</body>
</html>
