<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, initial-scale=1.0">
    <title>3DS Reddit Reader</title>
    <style>
        body {
            font-family: sans-serif;
            background: #000;
            color: #0f0;
            margin: 0;
            padding: 10px;
            line-height: 1.2;
        }
        h1 {
            color: #0f0;
            text-align: center;
            font-size: 16px;
            margin: 5px 0;
        }
        input, select, button {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px;
            margin: 4px 0;
            width: 100%;
            font-size: 14px;
        }
        button {
            background: #004400;
        }
        .post {
            border-bottom: 1px solid #004400;
            padding: 8px 0;
        }
        .title {
            color: #0ff;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
        }
        .meta {
            color: #888;
            font-size: 11px;
        }
        .status {
            color: #ff0;
            text-align: center;
            font-size: 12px;
        }
        .error { color: #f44; }
    </style>
</head>
<body>
    <h1>🕹️ 3DS Reddit</h1>
    
    <input type="text" id="subreddit" value="all">
    
    <select id="sort">
        <option value="hot">Hot</option>
        <option value="new">New</option>
        <option value="top">Top</option>
    </select>
    
    <button onclick="loadPosts()">Load Posts</button>
    
    <div id="status" class="status">Waiting...</div>
    <div id="posts"></div>

    <script type="text/javascript">
        function loadPosts() {
            var sub = document.getElementById('subreddit').value || 'all';
            var sort = document.getElementById('sort').value;
            var status = document.getElementById('status');
            var postsDiv = document.getElementById('posts');

            status.innerHTML = "Connecting to Proxy...";
            postsDiv.innerHTML = "";

            // The Reddit API URL (limited to 5 for 3DS RAM safety)
            var redditUrl = "https://www.reddit.com/r/" + sub + "/" + sort + ".json?limit=5";
            
            // AllOrigins Proxy URL
            var proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(redditUrl);

            var xhr = new XMLHttpRequest();
            xhr.open("GET", proxyUrl, true);

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var response = JSON.parse(xhr.responseText);
                            // AllOrigins wraps the result in a 'contents' string
                            var data = JSON.parse(response.contents);
                            render(data);
                            status.innerHTML = "Loaded: r/" + sub;
                        } catch (e) {
                            status.innerHTML = "<span class='error'>Parse Error (Subreddit private?)</span>";
                        }
                    } else {
                        status.innerHTML = "<span class='error'>SSL/Proxy Error: " + xhr.status + "</span>";
                    }
                }
            };
            
            xhr.onerror = function() {
                status.innerHTML = "<span class='error'>Connection Failed. SSL mismatch?</span>";
            };

            xhr.send();
        }

        function render(json) {
            var postsDiv = document.getElementById('posts');
            var items = json.data.children;
            
            for (var i = 0; i < items.length; i++) {
                var p = items[i].data;
                var itemDiv = document.createElement('div');
                itemDiv.className = 'post';
                
                // Using old.reddit.com for the links to save memory
                var link = "https://old.reddit.com" + p.permalink;
                
                itemDiv.innerHTML = 
                    '<div class="title"><a style="color:#0ff" href="' + link + '">' + p.title + '</a></div>' +
                    '<div class="meta">r/' + p.subreddit + ' | ' + p.score + ' pts</div>';
                
                postsDiv.appendChild(itemDiv);
            }
        }

        window.onload = loadPosts;
    </script>
</body>
</html>
